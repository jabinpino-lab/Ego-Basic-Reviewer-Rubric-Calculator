name: Build Desktop App

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer
        run: npm run desktop:dist
      - name: Upload Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: ego-basic-reviewer-rubric-calculator-windows
          path: release/*
          if-no-files-found: error
          retention-days: 14

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build macOS installer
        run: npm run desktop:dist
      - name: Upload macOS builds
        uses: actions/upload-artifact@v4
        with:
          name: ego-basic-reviewer-rubric-calculator-macos
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 14
